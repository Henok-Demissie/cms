<!DOCTYPE html>
<html>
<head>
<title>Expo QR Code</title>
<style>
body { 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    margin: 0;
    background: #1a1a2e;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
h1 { color: #00d4aa; margin-bottom: 5px; font-size: 28px; }
p { color: #888; margin-top: 5px; font-size: 14px; }
.qr-container {
    background: white;
    padding: 24px;
    border-radius: 16px;
    margin: 20px;
    box-shadow: 0 8px 32px rgba(0,212,170,0.3);
}
.url { 
    background: #16213e; 
    padding: 12px 24px; 
    border-radius: 8px; 
    font-family: monospace; 
    color: #00d4aa;
    font-size: 16px;
    letter-spacing: 0.5px;
}
canvas { display: block; }
.instructions {
    margin-top: 24px;
    text-align: center;
    max-width: 400px;
}
.instructions li {
    color: #aaa;
    text-align: left;
    margin: 6px 0;
    font-size: 13px;
}
</style>
</head>
<body>
<h1>📱 Expo Go QR Code</h1>
<p>Scan with Expo Go on your phone</p>
<div class="qr-container">
    <canvas id="qr"></canvas>
</div>
<div class="url">exp://192.168.100.8:8081</div>
<div class="instructions">
    <ol>
        <li>Install <strong>Expo Go</strong> from the App Store / Play Store</li>
        <li>Make sure your phone is on the same Wi-Fi network (<strong>192.168.100.x</strong>)</li>
        <li>Open Expo Go and scan the QR code above</li>
    </ol>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var typeNumber = 0;
var errorCorrectionLevel = 'L';
var qr = qrcode(typeNumber, errorCorrectionLevel);
qr.addData('exp://192.168.100.8:8081');
qr.make();

var canvas = document.getElementById('qr');
var moduleCount = qr.getModuleCount();
var cellSize = 10;
var margin = 4;
canvas.width = (moduleCount + margin * 2) * cellSize;
canvas.height = (moduleCount + margin * 2) * cellSize;

var ctx = canvas.getContext('2d');
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);

for (var row = 0; row < moduleCount; row++) {
    for (var col = 0; col < moduleCount; col++) {
        if (qr.isDark(row, col)) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(
                (col + margin) * cellSize,
                (row + margin) * cellSize,
                cellSize,
                cellSize
            );
        }
    }
}
</script>
</body>
</html>
